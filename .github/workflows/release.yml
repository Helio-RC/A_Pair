name: Release SeatFlow

on:
  push:
    branches: ['main']
    paths: ['version.json']
  workflow_dispatch:
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PROJECT_PATH: 'SeatFlow.Presentation.Avalonia'
  CONFIGURATION: 'Release'

concurrency: release-${{ github.ref }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 多平台构建 + vpk 打包
  # ──────────────────────────────────────────────
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
            vpk-directive: "[win]"
            main-exe: "SeatFlow.exe"
            icon: "Assets/installer.ico"
            extra-args: "--noPortable"

          - rid: linux-x64
            os: ubuntu-latest
            vpk-directive: "[linux]"
            main-exe: "SeatFlow"
            icon: "Assets/SF_icon_mini_background.png"
            extra-args: ""

          # TODO: macOS 暂不支持，后续启用
          # - rid: osx-x64
          #   os: macos-latest
          #   vpk-directive: "[osx]"
          #   main-exe: "SeatFlow"
          #   icon: "Assets/installer.png"
          #   extra-args: ""

          # - rid: osx-arm64
          #   os: macos-latest
          #   vpk-directive: "[osx]"
          #   main-exe: "SeatFlow"
          #   icon: "Assets/installer.png"
          #   extra-args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Version: $V"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools zstd

      - name: Install vpk
        run: dotnet tool install -g vpk && echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: dotnet publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c ${{ env.CONFIGURATION }} \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o publish/tmp

      - name: vpk pack
        run: |
          dotnet vpk ${{ matrix.vpk-directive }} pack \
            --packId SeatFlow \
            --packVersion ${{ steps.version.outputs.version }} \
            --packDir publish/tmp \
            --mainExe ${{ matrix.main-exe }} \
            --runtime ${{ matrix.rid }} \
            --channel ${{ matrix.rid }} \
            --outputDir publish/out \
            --packTitle "SeatFlow" \
            --packAuthors "Helio-RC" \
            --icon ${{ matrix.icon }} \
            --delta BestSpeed \
            ${{ matrix.extra-args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            publish/out/*.exe
            publish/out/*.AppImage
            publish/out/*.pkg
            publish/out/*.dmg
            publish/out/*.nupkg
            publish/out/releases.*.json
            publish/out/RELEASES-*
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Job 2: GitHub Release + OSS 上传
  # ──────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          V="${{ needs.build.outputs.version }}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Version: $V"

      - name: Install dependencies
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: pip install oss2 packaging

      - name: Pre-flight checks
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"
          echo "Target: $TAG"

          # 1. 禁止发布已存在的 Release
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "✗ Release $TAG already exists. Abort."
            exit 1
          fi

          # 2. 版本号必须大于当前最大 Release tag
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" -L 1 --order desc --exclude-pre-releases --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            LATEST=${LATEST_TAG#v}
            echo "Latest release: $LATEST_TAG"
            RESULT=$(python3 -c "
          from packaging.version import Version
          print('ok' if Version('$V') > Version('$LATEST') else 'fail')
          ")
            if [[ "$RESULT" == "fail" ]]; then
              echo "✗ Version $V is not greater than latest $LATEST. Abort."
              exit 1
            fi
            echo "✓ Version $V > $LATEST"
          else
            echo "No existing releases — first release, proceeding."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la all-artifacts/

      - name: Validate RELEASE.md
        run: |
          if [ ! -f RELEASE.md ]; then
            echo "✗ RELEASE.md not found in repository root."
            exit 1
          fi
          echo "✓ RELEASE.md found"

      # ── 1. 构建 Release body（RELEASE.md + SHA256 表格） ──
      - name: Build release body
        id: body
        shell: bash
        run: |
          shopt -s nullglob
          {
            cat RELEASE.md
            echo ""
            echo "### SHA256 Checksums"
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
            for ext in exe AppImage pkg dmg; do
              for f in all-artifacts/*.$ext; do
                SHA=$(sha256sum "$f" | awk '{print $1}')
                NAME=$(basename "$f")
                echo "| $NAME | $SHA |"
              done
            done
          } > /tmp/release-body.md

      # ── 2. 创建 GitHub Release ──
      - name: Create GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          V="${{ steps.version.outputs.version }}"
          ASSETS=()
          for ext in exe AppImage pkg dmg; do
            for f in all-artifacts/*.$ext; do
              ASSETS+=("$f")
            done
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "✗ No release assets found!"
            exit 1
          fi
          gh release create "v${V}" \
            --repo "${{ github.repository }}" \
            --title "SeatFlow ${V}" \
            --notes-file /tmp/release-body.md \
            "${ASSETS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── 3. OSS 上传（先校验索引，再上传文件，保证原子性） ──
      - name: Upload to OSS
        run: |
          python3 << 'PYEOF'
          import hashlib, json, os, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import oss2
          import oss2.exceptions

          VERSION = "${{ steps.version.outputs.version }}"
          ARTIFACTS_DIR = Path("all-artifacts")
          RELEASE_MD = Path("RELEASE.md")
          COMMIT_ID = "${{ github.sha }}"

          def is_installer(name):
              n = name.lower()
              return n.endswith(('.exe', '.appimage', '.pkg', '.dmg'))

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  while chunk := f.read(8192):
                      h.update(chunk)
              return h.hexdigest()

          def guess_platform(name):
              n = name.lower()
              if 'win' in n or n.endswith('.exe'):
                  return 'windows'
              if 'linux' in n or n.endswith('.appimage'):
                  return 'linux'
              if 'osx-arm64' in n or 'macos-arm64' in n:
                  return 'macos-arm64'
              if 'osx' in n or 'macos' in n or n.endswith(('.pkg', '.dmg')):
                  return 'macos-x64'
              return 'unknown'

          # ── OSS 连接 ──
          auth = oss2.Auth(os.environ['OSS_KEY_ID'], os.environ['OSS_KEY_SECRET'])
          bucket = oss2.Bucket(auth, os.environ['OSS_ENDPOINT'], os.environ['OSS_BUCKET'])

          all_files = sorted([f for f in ARTIFACTS_DIR.iterdir() if f.is_file()],
                             key=lambda f: f.name)
          if not all_files:
              print("No artifacts found, skipping OSS upload.")
              sys.exit(0)

          installers = [f for f in all_files if is_installer(f.name)]
          updates = [f for f in all_files if not is_installer(f.name)]
          print(f"Artifacts: {len(installers)} installers + {len(updates)} updates")

          # ── 0. 先校验 releases.json 索引（确保版本可用后再上传文件） ──
          index_key = "releases/releases.json"
          existing = None
          try:
              result = bucket.get_object(index_key)
              existing = json.loads(result.read())
          except oss2.exceptions.NoSuchKey:
              print("  releases.json not found, will create.")

          if existing is None:
              existing = {"latest": VERSION, "versions": []}
          else:
              for v in existing.get("versions", []):
                  if v["version"] == VERSION:
                      print(f"✗ Version {VERSION} already exists in releases.json.")
                      sys.exit(1)

          print("Pre-checks passed, uploading...")

          prefix = f"releases/{VERSION}"

          # ── 1. 上传 RELEASE.md ──
          if RELEASE_MD.exists():
              release_notes = RELEASE_MD.read_text(encoding='utf-8')
              bucket.put_object(f"{prefix}/RELEASE.md", release_notes.encode('utf-8'),
                                headers={'Content-Type': 'text/markdown'})
              print(f"  ✓ {prefix}/RELEASE.md")
          else:
              release_notes = ""

          # ── 2. 上传安装包 → releases/{version}/（已存在则跳过） ──
          if installers:
              print(f"  [安装包 → {prefix}/]")
              for f in installers:
                  key = f"{prefix}/{f.name}"
                  if bucket.object_exists(key):
                      print(f"    - {key} (已存在，跳过)")
                      continue
                  bucket.put_object_from_file(key, str(f))
                  size_mb = f.stat().st_size / (1024 * 1024)
                  print(f"    ✓ {key} ({size_mb:.1f} MiB)")

          # ── 3. 上传更新包 → updates/ ──
          # nupkg → 已存在则跳过；通道元数据 → 每次覆盖
          if updates:
              print("  [更新包 → updates/]")
              for f in updates:
                  key = f"updates/{f.name}"
                  name_lower = f.name.lower()
                  if name_lower.endswith('.nupkg'):
                      if bucket.object_exists(key):
                          print(f"    - {key} (已存在，跳过)")
                          continue
                  bucket.put_object_from_file(key, str(f))
                  size_mb = f.stat().st_size / (1024 * 1024)
                  print(f"    ✓ {key} ({size_mb:.1f} MiB)")

          # ── 4. 写入 releases.json（前面的预检已确保版本不重复） ──
          release_date = datetime.now(timezone(timedelta(hours=8))).isoformat()
          entry = {
              "version": VERSION,
              "commitId": COMMIT_ID,
              "releaseDate": release_date,
              "notes": release_notes.strip(),
              "files": [
                  {
                      "platform": guess_platform(f.name),
                      "fileName": f.name,
                      "size": f.stat().st_size,
                      "sha256": sha256_file(f),
                  }
                  for f in installers
              ],
          }

          existing["versions"].insert(0, entry)
          existing["latest"] = VERSION

          data = json.dumps(existing, ensure_ascii=False, indent=2).encode("utf-8")
          bucket.put_object(index_key, data, headers={"Content-Type": "application/json"})
          print(f"  ✓ {index_key} (latest: {VERSION})")
          print("OSS upload complete.")
          PYEOF
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
