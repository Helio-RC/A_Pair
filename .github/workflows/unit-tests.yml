name: UnitTests

on:
  push:
    paths: ['**.cs', '**.csproj', '**.slnx', '**.axaml']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            {
              "core": ["src/SeatFlow.Core/**", "src/SeatFlow.Contracts/**"],
              "infra": ["src/SeatFlow.Infrastructure/**"],
              "app": ["src/SeatFlow.Application/**"],
              "pres": ["src/SeatFlow.Presentation.Avalonia/**"],
              "tests-core": ["tests/SeatFlow.Core.Tests/**"],
              "tests-infra": ["tests/SeatFlow.Infrastructure.Tests/**"],
              "tests-app": ["tests/SeatFlow.Application.Tests/**"]
            }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build

      - if: steps.filter.outputs.core == 'true'
           || steps.filter.outputs.infra == 'true'
           || steps.filter.outputs.tests-core == 'true'
        run: dotnet test tests/SeatFlow.Core.Tests --no-build

      - if: steps.filter.outputs.core == 'true'
           || steps.filter.outputs.infra == 'true'
           || steps.filter.outputs.tests-infra == 'true'
        run: dotnet test tests/SeatFlow.Infrastructure.Tests --no-build

      - if: steps.filter.outputs.core == 'true'
           || steps.filter.outputs.infra == 'true'
           || steps.filter.outputs.app == 'true'
           || steps.filter.outputs.tests-app == 'true'
        run: dotnet test tests/SeatFlow.Application.Tests --no-build
