name: Release SeatFlow

on:
  push:
    branches: ['main']
    paths: ['version.json']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（覆盖 version.json，如 2.0.1）'
        required: true
        type: string
      suffix:
        description: '可选后缀（如 beta.1 / rc），自动设为 pre-release'
        required: false
        type: string
        default: ''

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PROJECT_PATH: 'src/SeatFlow.Presentation.Avalonia'
  CONFIGURATION: 'Release'

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 多平台构建 + vpk 打包（含 delta 增量）
  # ──────────────────────────────────────────────
  build:
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_pre: ${{ steps.version.outputs.is_pre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
            vpk-directive: '[win]'
            main-exe: 'SeatFlow.exe'
            icon: 'Assets/installer.ico'
            extra-args: '--noPortable'

          - rid: linux-x64
            os: ubuntu-latest
            vpk-directive: '[linux]'
            main-exe: 'SeatFlow'
            icon: 'Assets/SF_icon_mini_background.png'
            extra-args: ''

          - rid: osx-x64
            os: macos-latest
            vpk-directive: '[osx]'
            main-exe: 'SeatFlow'
            icon: 'Assets/installer.png'
            extra-args: ''

          - rid: osx-arm64
            os: macos-latest
            vpk-directive: '[osx]'
            main-exe: 'SeatFlow'
            icon: 'Assets/installer.png'
            extra-args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            SUFFIX="${{ inputs.suffix }}"
            if [ -n "$SUFFIX" ]; then V="${V}-${SUFFIX}"; fi
            echo "is_pre=true" >> "$GITHUB_OUTPUT"
            echo "Is manual release (pre-release)"
          else
            V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
            echo "is_pre=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools zstd

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install vpk
        run: dotnet tool install -g vpk && echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: dotnet publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c ${{ env.CONFIGURATION }} \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o publish/tmp

      - name: Fetch previous release (delta base)
        shell: bash
        env:
          VPK_CHANNEL: ${{ matrix.rid }}
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          OUTPUT_DIR: 'publish/out'
        run: bash scripts/ci/fetch_previous.sh

      - name: vpk pack
        shell: bash
        run: |
          # 签名参数可选：secrets 为空时不附加（跳过签名环节）
          SIGN_ARGS=()
          if [ -n "${VPK_KEY_ID:-}" ]; then SIGN_ARGS+=(--keyId "$VPK_KEY_ID"); fi
          if [ -n "${VPK_KEY_FILE:-}" ]; then SIGN_ARGS+=(--keyFile "$VPK_KEY_FILE"); fi
          if [ -n "${VPK_KEY_PASSWORD:-}" ]; then SIGN_ARGS+=(--keyPassword "$VPK_KEY_PASSWORD"); fi
          vpk ${{ matrix.vpk-directive }} pack \
            --packId SeatFlow \
            --packVersion ${{ steps.version.outputs.version }} \
            --packDir publish/tmp \
            --mainExe ${{ matrix.main-exe }} \
            --runtime ${{ matrix.rid }} \
            --channel ${{ matrix.rid }} \
            --outputDir publish/out \
            --packTitle "SeatFlow" \
            --packAuthors "Helio-RC" \
            --icon ${{ matrix.icon }} \
            --delta BestSpeed \
            ${{ matrix.extra-args }} \
            "${SIGN_ARGS[@]}"
        env:
          VPK_KEY_ID: ${{ secrets.VPK_KEY_ID }}
          VPK_KEY_FILE: ${{ secrets.VPK_KEY_FILE }}
          VPK_KEY_PASSWORD: ${{ secrets.VPK_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            publish/out/*.exe
            publish/out/*.AppImage
            publish/out/*.pkg
            publish/out/*.dmg
            publish/out/*.nupkg
            publish/out/releases.*.json
            publish/out/RELEASES-*
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Job 2: GitHub Release + OSS 上传（自动发布）
  # ──────────────────────────────────────────────
  release:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: OSS
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          V="${{ needs.build.outputs.version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Install dependencies
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        run: pip install oss2 packaging

      - name: Pre-flight checks
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"
          echo "Target: $TAG"

          # 1. 禁止发布已存在的 Release
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "✗ Release $TAG already exists. Abort."
            exit 1
          fi

          # 2. 版本号必须大于当前最大 Release tag
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" -L 1 --order desc --exclude-pre-releases --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            LATEST=${LATEST_TAG#v}
            echo "Latest release: $LATEST_TAG"
            RESULT=$(python3 -c "
          from packaging.version import Version
          print('ok' if Version('$V') > Version('$LATEST') else 'fail')
          ")
            if [[ "$RESULT" == "fail" ]]; then
              echo "✗ Version $V is not greater than latest $LATEST. Abort."
              exit 1
            fi
            echo "✓ Version $V > $LATEST"
          else
            echo "No existing releases — first release, proceeding."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'release-*'
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la all-artifacts/

      - name: Version installer filenames
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "Versioning installer files with ${V}..."
          shopt -s nullglob
          for f in all-artifacts/*.exe all-artifacts/*.AppImage all-artifacts/*.pkg all-artifacts/*.dmg; do
            name=$(basename "$f")
            stem="${name%.*}"
            ext="${name##*.}"
            # 已有版本号则跳过
            if [[ "$stem" == *"-${V}"* ]] || [[ "$stem" == *"_${V}"* ]]; then
              echo "  - ${name} (已包含版本号，跳过)"
              continue
            fi
            newname="all-artifacts/${stem}-${V}.${ext}"
            mv "$f" "$newname"
            echo "  ✓ ${name} → $(basename "$newname")"
          done

      - name: Validate RELEASE.md
        run: |
          if [ ! -f RELEASE.md ]; then
            echo "✗ RELEASE.md not found in repository root."
            exit 1
          fi
          echo "✓ RELEASE.md found"

      - name: Build release body
        shell: bash
        run: |
          shopt -s nullglob
          {
            cat RELEASE.md
            echo ""
            echo "### SHA256 Checksums"
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
            for ext in exe AppImage pkg dmg; do
              for f in all-artifacts/*.$ext; do
                SHA=$(sha256sum "$f" | awk '{print $1}')
                NAME=$(basename "$f")
                echo "| $NAME | $SHA |"
              done
            done
          } > /tmp/release-body.md

      - name: Upload to OSS
        if: github.event_name == 'push'
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          python3 scripts/ci/upload_oss.py \
            --version "${{ steps.version.outputs.version }}" \
            --artifacts-dir all-artifacts \
            --release-md RELEASE.md \
            --commit-id "${{ github.sha }}"

      - name: Create GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          V="${{ steps.version.outputs.version }}"
          PRE="${{ needs.build.outputs.is_pre }}"
          ARGS=()
          if [ "$PRE" = "true" ]; then
            ARGS+=(--prerelease)
            echo "Creating pre-release: v${V}"
          else
            echo "Creating latest release: v${V}"
          fi
          ASSETS=()
          for ext in exe AppImage pkg dmg; do
            for f in all-artifacts/*.$ext; do
              ASSETS+=("$f")
            done
          done
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "✗ No release assets found!"
            exit 1
          fi
          gh release create "v${V}" \
            --repo "${{ github.repository }}" \
            --title "SeatFlow ${V}" \
            --notes-file /tmp/release-body.md \
            "${ARGS[@]}" \
            "${ASSETS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
