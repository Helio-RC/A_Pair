name: Release SeatFlow

on:
  push:
    branches: ['main', 'develop']
    paths: ['version.json']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (override version.json, e.g. 1.4.1)'
        required: false
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PROJECT_PATH: 'SeatFlow.Presentation.Avalonia'
  CONFIGURATION: 'Release'

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 多平台构建 + vpk 打包
  # ──────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            vpk-directive: "[win]"
            main-exe: "SeatFlow.exe"
            icon: "Assets/installer.ico"
            extra-args: "--noPortable"

          - rid: linux-x64
            os: ubuntu-latest
            vpk-directive: "[linux]"
            main-exe: "SeatFlow"
            icon: "Assets/SF_icon_mini_background.png"
            extra-args: ""

          # TODO: macOS 暂不支持，后续启用
          # - rid: osx-x64
          #   os: macos-latest
          #   vpk-directive: "[osx]"
          #   main-exe: "SeatFlow"
          #   icon: "Assets/installer.png"
          #   extra-args: ""

          # - rid: osx-arm64
          #   os: macos-latest
          #   vpk-directive: "[osx]"
          #   main-exe: "SeatFlow"
          #   icon: "Assets/installer.png"
          #   extra-args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            python3 -c "
          import json
          with open('version.json') as f:
              data = json.load(f)
          data['version'] = '${{ inputs.version }}'
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
            "
          fi
          V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Version: $V"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools zstd

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: dotnet publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c ${{ env.CONFIGURATION }} \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o publish/tmp

      - name: vpk pack
        run: |
          dotnet vpk ${{ matrix.vpk-directive }} pack \
            --packId SeatFlow \
            --packVersion ${{ steps.version.outputs.version }} \
            --packDir publish/tmp \
            --mainExe ${{ matrix.main-exe }} \
            --runtime ${{ matrix.rid }} \
            --channel ${{ matrix.rid }} \
            --outputDir publish/out \
            --packTitle "SeatFlow" \
            --packAuthors "Helio-RC" \
            --icon ${{ matrix.icon }} \
            --delta BestSpeed \
            ${{ matrix.extra-args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            publish/out/*.exe
            publish/out/*.AppImage
            publish/out/*.pkg
            publish/out/*.dmg
            publish/out/*.nupkg
            publish/out/releases.*.json
            publish/out/RELEASES-*
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Job 3: GitHub Release + OSS 上传
  # ──────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Version: $V"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OSS SDK
        run: pip install oss2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la all-artifacts/

      # ── 1. 构建 Release body（RELEASE.md + SHA256 表格） ──
      - name: Build release body
        id: body
        run: |
          {
            cat RELEASE.md
            echo ""
            echo "### SHA256 Checksums"
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
            for f in all-artifacts/*.exe all-artifacts/*.AppImage all-artifacts/*.pkg all-artifacts/*.dmg; do
              [ -f "$f" ] || continue
              SHA=$(sha256sum "$f" | awk '{print $1}')
              NAME=$(basename "$f")
              echo "| $NAME | $SHA |"
            done
          } > /tmp/release-body.md
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release-body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 2. 创建 GitHub Release ──
      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "SeatFlow ${VERSION}" \
            --notes-file /tmp/release-body.md \
            all-artifacts/*.exe \
            all-artifacts/*.AppImage \
            all-artifacts/*.pkg \
            all-artifacts/*.dmg \
            || echo "::warning::Release may already exist (non-fatal)"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── 3. OSS 上传（与 release.py 行为严格一致） ──
      - name: Upload to OSS
        run: |
          python3 << 'PYEOF'
          import hashlib, json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          import oss2

          VERSION = "${{ steps.version.outputs.version }}"
          ARTIFACTS_DIR = Path("all-artifacts")
          RELEASE_MD = Path("RELEASE.md")
          COMMIT_ID = "${{ github.sha }}"

          def is_installer(name):
              """_is_installer() — 可下载的安装程序"""
              n = name.lower()
              return n.endswith(('.exe', '.appimage', '.pkg', '.dmg'))

          def should_distribute(name):
              """_should_distribute() — 过滤 vpk 内部元数据"""
              n = name.lower()
              if n.startswith('assets.') and n.endswith('.json'):
                  return False
              return True

          def sha256_file(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  while chunk := f.read(8192):
                      h.update(chunk)
              return h.hexdigest()

          def guess_platform(name):
              n = name.lower()
              if 'win' in n or n.endswith('.exe'):
                  return 'windows'
              if 'linux' in n or n.endswith('.appimage'):
                  return 'linux'
              if 'osx-arm64' in n or 'macos-arm64' in n:
                  return 'macos-arm64'
              if 'osx' in n or 'macos' in n or n.endswith(('.pkg', '.dmg')):
                  return 'macos-x64'
              return 'unknown'

          # ── OSS 连接 ──
          auth = oss2.Auth(os.environ['OSS_KEY_ID'], os.environ['OSS_KEY_SECRET'])
          bucket = oss2.Bucket(auth, os.environ['OSS_ENDPOINT'], os.environ['OSS_BUCKET'])

          # 扫描 + 过滤产物
          all_files = sorted(
              [f for f in ARTIFACTS_DIR.iterdir() if f.is_file() and should_distribute(f.name)],
              key=lambda f: f.name,
          )
          if not all_files:
              print("No artifacts found, skipping OSS upload.")
              sys.exit(0)

          installers = [f for f in all_files if is_installer(f.name)]
          updates = [f for f in all_files if not is_installer(f.name)]
          print(f"Artifacts: {len(installers)} installers + {len(updates)} updates")

          prefix = f"releases/{VERSION}"

          # ── 1. 上传 RELEASE.md ──
          if RELEASE_MD.exists():
              release_notes = RELEASE_MD.read_text(encoding='utf-8')
              bucket.put_object(f"{prefix}/RELEASE.md", release_notes.encode('utf-8'),
                                headers={'Content-Type': 'text/markdown'})
              print(f"  ✓ {prefix}/RELEASE.md")
          else:
              release_notes = ""

          # ── 2. 上传安装包 → releases/{version}/（已存在则跳过） ──
          if installers:
              print(f"  [安装包 → {prefix}/]")
              for f in installers:
                  key = f"{prefix}/{f.name}"
                  if bucket.object_exists(key):
                      print(f"    - {key} (已存在，跳过)")
                      continue
                  bucket.put_object_from_file(key, str(f))
                  size_mb = f.stat().st_size / (1024 * 1024)
                  print(f"    ✓ {key} ({size_mb:.1f} MiB)")

          # ── 3. 上传更新包 → updates/ ──
          # nupkg → 已存在则跳过；通道元数据 → 每次覆盖
          if updates:
              print("  [更新包 → updates/]")
              for f in updates:
                  key = f"updates/{f.name}"
                  name_lower = f.name.lower()
                  if name_lower.endswith('.nupkg'):
                      if bucket.object_exists(key):
                          print(f"    - {key} (已存在，跳过)")
                          continue
                  bucket.put_object_from_file(key, str(f))
                  size_mb = f.stat().st_size / (1024 * 1024)
                  print(f"    ✓ {key} ({size_mb:.1f} MiB)")

          # ── 4. 更新 releases.json 索引 ──
          index_key = "releases/releases.json"
          existing = None
          try:
              result = bucket.get_object(index_key)
              existing = json.loads(result.read())
          except Exception:
              print("  releases.json 不存在，将创建新的版本索引。")

          if existing is None:
              existing = {"latest": VERSION, "versions": []}

          # 检查版本是否已存在
          for v in existing.get("versions", []):
              if v["version"] == VERSION:
                  raise ValueError(
                      f"版本 {VERSION} 已存在于 releases.json 中。"
                      f"禁止覆盖已发布版本。"
                  )

          # 构建新条目（插入到头部）
          release_date = datetime.now(timezone.utc).astimezone().isoformat()
          entry = {
              "version": VERSION,
              "commitId": COMMIT_ID,
              "releaseDate": release_date,
              "notes": release_notes.strip(),
              "files": [
                  {
                      "platform": guess_platform(f.name),
                      "fileName": f.name,
                      "size": f.stat().st_size,
                      "sha256": sha256_file(f),
                  }
                  for f in installers
              ],
          }

          existing["versions"].insert(0, entry)
          existing["latest"] = VERSION

          # 上传
          data = json.dumps(existing, ensure_ascii=False, indent=2).encode("utf-8")
          bucket.put_object(index_key, data, headers={"Content-Type": "application/json"})
          print(f"  ✓ {index_key} (latest: {VERSION})")
          print("OSS upload complete.")
          PYEOF
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
