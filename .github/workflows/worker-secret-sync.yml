name: Worker Secret Sync

on:
  schedule:
    # 每周一 03:00 UTC（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: worker-secret-sync
  cancel-in-progress: false

env:
  CF_API_BASE: ${{ vars.CF_API_BASE }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rotate worker OSS secrets
        run: |
          python3 scripts/ci/rotate_worker_secrets.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_WORKER_SCRIPT: ${{ vars.CF_WORKER_SCRIPT }}
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}

      - name: Open issue on failure
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY_ZH="工作流 Worker Secret Sync（$RUN_URL）密钥轮换失败，请检查 Cloudflare 或 OSS 凭证配置。"
          gh label create ops --repo "${{ github.repository }}" -c "111111" 2>/dev/null || true
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "密钥同步失败（$(date -u +%Y-%m-%d)）" \
            --body "$BODY_ZH" \
            --label "ops"
        env:
          GH_TOKEN: ${{ github.token }}
